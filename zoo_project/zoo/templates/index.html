{% extends 'base.html' %}
{% block content %}
<h1>Все животные зоопарка</h1>
<table class="table table-dark table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Вид</th>
            <th>Здоровье</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for animal in animals %}
        <tr>
            <td>{{ animal.id }}</td>
            <td><a href="{% url 'animal_detail' animal.id %}" class="text-info">{{ animal.name }}</a></td>
            <td>{{ animal.species }}</td>
            <td>{{ animal.health }}</td>
            <td>
                <button class="btn btn-success btn-sm">Купить</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
