{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Зоопарк{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .navbar { background-color: #1e1e1e; }
        .table { background-color: #1e1e1e; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'zoo:index' %}">Зоопарк</a>
            <div class="navbar-nav">
                <a class="nav-link text-primary" href="{% url 'healthy_animals' %}">Животные с хорошим здоровьем</a>
                <a class="nav-link text-danger" href="/admin/">Панель администратора</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
